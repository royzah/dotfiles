# Wayland session defaults. Safe on any GPU; linked by install.sh.

# Electron apps (VS Code, Discord, Obsidian) pick Wayland instead of XWayland,
# which fixes blurry scaling on HiDPI and cuts input latency.
ELECTRON_OZONE_PLATFORM_HINT=auto

# Firefox defaults to Wayland already; explicit for older builds
MOZ_ENABLE_WAYLAND=1

# Qt apps follow the session, falling back to X11 where Wayland is missing
QT_QPA_PLATFORM=wayland;xcb
