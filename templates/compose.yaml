  # Single-node KRaft, no ZooKeeper since Kafka 4.x
  # kafka:
  #   image: apache/kafka:4.2.0
  #   ports:
  #     - "9092:9092"

  # S3-compatible object storage: MinIO was archived Apr 2026 - prefer
  # SeaweedFS or Garage for a maintained local S3.
  # seaweedfs:
  #   image: chrislusf/seaweedfs
