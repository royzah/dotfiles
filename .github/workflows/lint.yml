name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history

      # luacheck's prebuilt binary needs glibc 2.38+, so it comes from apt
      - name: Install zsh and luacheck
        run: sudo apt-get update && sudo apt-get install -y zsh lua-check

      # Same pinned versions as `just lint` locally, from mise.toml
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node just shellcheck shfmt stylua npm:markdownlint-cli gitleaks bats

      - run: just lint
      - run: just test

  # Templates are copied into new projects, so a broken one spreads
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check --all-systems --no-write-lock-file ./templates
      - run: nix run nixpkgs#alejandra -- --check templates/flake.nix
      - run: docker compose -f templates/compose.yaml config -q
