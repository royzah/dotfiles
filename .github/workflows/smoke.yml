name: smoke

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - bootstrap-user.sh
      - mise*.toml
      - bin/**
      - claude/**
      - systemd/**
      - tests/smoke.sh
      - .github/workflows/smoke.yml
  pull_request:
    paths:
      - install.sh
      - bootstrap-user.sh
      - mise*.toml
      - bin/**
      - claude/**
      - systemd/**
      - tests/smoke.sh
      - .github/workflows/smoke.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/smoke.sh ${{ matrix.profile }}
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
