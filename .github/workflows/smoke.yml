name: smoke

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - bin/**
      - claude/**
      - systemd/**
      - tests/smoke.sh
      - .github/workflows/smoke.yml
  pull_request:
    paths:
      - install.sh
      - bin/**
      - claude/**
      - systemd/**
      - tests/smoke.sh
      - .github/workflows/smoke.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/smoke.sh
