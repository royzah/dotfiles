# ------------------------------------------------------------------------------
# Tmux Configuration
# ------------------------------------------------------------------------------

# Set prefix to Ctrl-a (easier to reach than Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Force zsh regardless of parent shell
set-option -g default-shell /usr/bin/zsh

# Enable true colors + undercurl (for nvim LSP diagnostics)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse support
set -g mouse on

# Faster key repetition
set -s escape-time 0

# Increase history (effectively unlimited)
set -g history-limit 1000000

# ------------------------------------------------------------------------------
# Key Bindings
# ------------------------------------------------------------------------------

# Reload config
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and -
bind -N "Split pane right" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane down" - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with vim-like keys
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

# Resize panes
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# Window navigation
bind -r -N "Previous window" C-h previous-window
bind -r -N "Next window" C-l next-window
bind -N "Last window" Tab last-window

# Copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open new windows/panes in current directory
bind -N "New window here" c new-window -c "#{pane_current_path}"

# Session management
bind -N "Session tree" S choose-tree -Zs
bind -N "New session" s new-session
bind-key -N "Kill pane" x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind -N "Fuzzy session picker" f display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | fzf --reverse | xargs tmux switch-client -t"

# ------------------------------------------------------------------------------
# Status Bar
# ------------------------------------------------------------------------------

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left-length 60
set -g status-right-length 90

# Status left
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] '

# Status right
set -g status-right '#[fg=#f38ba8]#(cd #{pane_current_path}; git branch --show-current) #[fg=#cdd6f4]| #[fg=#a6e3a1]%H:%M #[fg=#cdd6f4]| #[fg=#f9e2af]%d-%b-%y '

# Window status
set -g window-status-format '#[fg=#6c7086] #I:#W '
set -g window-status-current-format '#[bg=#313244,fg=#cdd6f4,bold] #I:#W '

# Message style
set -g message-style 'fg=#cdd6f4 bg=#313244 bold'

# ------------------------------------------------------------------------------
# Plugins (using TPM)
# ------------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'fcsonline/tmux-thumbs'

# Thumbs settings (quick-copy URLs, hashes, IPs, paths)
set -g @thumbs-key F
# clip_copy picks clip.exe (WSL), wl-copy (Wayland) or xclip (X11)
set -g @thumbs-command 'printf %s "{}" | bash -c "source ~/bin/hw-profile.sh && clip_copy"'
set -g @thumbs-upcase-command 'bash -c "source ~/bin/hw-profile.sh && open_url \"\$1\"" _ "{}"'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Project sessionizer (zoxide-powered)
bind -N "Project sessionizer" p display-popup -E "~/bin/tmux-sessionizer.sh"

# Floating popups (80% of screen)
bind -N "AI popup (Claude, or Copilot at work)" a display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "~/bin/ai.sh"
bind -N "lazygit popup" g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind -N "k9s popup" K display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "k9s"
bind -N "btop popup" B display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "btop"
bind -N "nvim popup" N display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "nvim"

# Quick debugging layout: serial + editor + shell
bind -N "Debug layout" D split-window -h -p 40 \; split-window -v -p 30 \; select-pane -t 0

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
